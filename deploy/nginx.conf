# nginx 配置示例 —— 跳色科技公司 ERP 思维导图系统
# 使用方式（宝塔）：网站 -> 设置 -> 配置文件，替换/追加到 server{} 块
# 注意：把 your-domain.com 换成你的域名，把路径换成实际部署路径

server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名

    # 前端打包产物目录
    root /www/wwwroot/erp-mindmap/frontend/dist;
    index index.html;

    # 访问日志
    access_log /www/wwwlogs/erp-mindmap.access.log;
    error_log  /www/wwwlogs/erp-mindmap.error.log;

    # 上传体积（脑图配置 JSON 很小，留够余量即可）
    client_max_body_size 8m;

    # ---------- 前端（history 路由回退） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 接口反向代理到 Node 后端 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
