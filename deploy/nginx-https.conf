# HTTPS 版 Nginx 配置（HTTP 自动跳 HTTPS）
# 证书路径按宝塔/Let's Encrypt 实际路径修改

server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;          # ← 改成你的域名

    # 证书（宝塔申请 Let's Encrypt 后的路径示例）
    ssl_certificate     /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/wwwroot/erp-mindmap/frontend/dist;
    index index.html;
    client_max_body_size 12m;

    access_log /www/wwwlogs/erp-mindmap.access.log;
    error_log  /www/wwwlogs/erp-mindmap.error.log;

    # 前端（history 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # 上传文件（图片/附件）
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
